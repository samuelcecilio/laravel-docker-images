name: publish

# Builds each image/version on native runners (amd64 and arm64), pushes by digest
# and merges both into a multi-arch manifest with the tags from the justfile.
#
# - push to main: rebuilds only the changed version directories (or everything,
#   if the justfile, the workflow etc. changed)
# - pull request: builds only, does not publish
# - schedule: weekly rebuild of everything, without cache, to pick up security patches
# - workflow_dispatch: same as `just push [image] [version]`

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      image:
        description: "Image (php-fpm, swoole or all)"
        default: all
      version:
        description: "PHP version (e.g. 8.5, or all)"
        default: all
      no_cache:
        description: "Build without cache"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # PRs cancel the previous run; publishing runs are never cancelled
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      registry: ${{ steps.targets.outputs.registry }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      # List the {image, version, tags} targets from the justfile and the directories
      - id: targets
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          WANT_IMAGE: ${{ inputs.image || 'all' }}
          WANT_VERSION: ${{ inputs.version || 'all' }}
        run: |
          set -euo pipefail
          registry=$(just --evaluate registry)
          images=$(just --evaluate images)

          # On push/PR, only what changed. A change outside the version directories
          # (justfile, workflow...) rebuilds everything; docs and example/ do not count.
          full=1
          changed=""
          base=""
          case "$EVENT" in
            push) [[ "$BEFORE" =~ ^0+$ ]] || base="$BEFORE" ;;
            pull_request) base="$PR_BASE" ;;
          esac
          if [ -n "$base" ]; then
            full=0
            while read -r f; do
              [ -n "$f" ] || continue
              if [[ "$f" =~ ^([^/]+)/([0-9]+\.[0-9]+)/ ]]; then
                changed+="${BASH_REMATCH[1]}/${BASH_REMATCH[2]}"$'\n'
              elif [[ "$f" == *.md || "$f" == */example/* || "$f" == .editorconfig || "$f" == .gitignore ]]; then
                :
              else
                echo "$f changed, rebuilding everything"
                full=1
              fi
            done < <(git diff --name-only "$base" "$GITHUB_SHA")
          fi

          targets='[]'
          for img in $images; do
            [ "$WANT_IMAGE" = all ] || [ "$WANT_IMAGE" = "$img" ] || continue
            for v in $(just _versions "$img" all); do
              [ "$WANT_VERSION" = all ] || [ "$WANT_VERSION" = "$v" ] || continue
              [ "$full" = 1 ] || grep -qxF "$img/$v" <<<"$changed" || continue
              just _guard "$img" "$v"
              tags=$(just _tag_args "$img" "$v" | tr ' ' '\n' | grep -v '^-t$' | paste -sd, -)
              targets=$(jq -c --arg i "$img" --arg v "$v" --arg t "$tags" \
                '. + [{image: $i, version: $v, tags: $t}]' <<<"$targets")
            done
          done

          if [ "$EVENT" = workflow_dispatch ] && [ "$targets" = '[]' ]; then
            echo "error: no targets for image=$WANT_IMAGE version=$WANT_VERSION" >&2
            exit 1
          fi

          jq . <<<"$targets"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    if: needs.matrix.outputs.targets != '[]'
    runs-on: ${{ matrix.platform.runner }}
    name: build ${{ matrix.target.image }}:${{ matrix.target.version }} (${{ matrix.platform.arch }})
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.matrix.outputs.targets) }}
        platform:
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-24.04 }
          - { arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    env:
      REPO: docker.io/${{ needs.matrix.outputs.registry }}/${{ matrix.target.image }}
      SCOPE: ${{ matrix.target.image }}-${{ matrix.target.version }}-${{ matrix.platform.arch }}
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.target.image }}/${{ matrix.target.version }}
          platforms: ${{ matrix.platform.platform }}
          pull: true
          no-cache: ${{ github.event_name == 'schedule' || inputs.no_cache == true }}
          outputs: ${{ env.PUBLISH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.REPO) || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ env.SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.SCOPE }}

      - if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.SCOPE }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [matrix, build]
    if: github.event_name != 'pull_request' && needs.matrix.outputs.targets != '[]'
    runs-on: ubuntu-24.04
    name: publish ${{ matrix.target.image }}:${{ matrix.target.version }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.matrix.outputs.targets) }}
    env:
      REPO: docker.io/${{ needs.matrix.outputs.registry }}/${{ matrix.target.image }}
      TAGS: ${{ matrix.target.tags }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.target.image }}-${{ matrix.target.version }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/digests"
          IFS=, read -ra tags <<<"$TAGS"
          args=()
          for t in "${tags[@]}"; do args+=(-t "$t"); done
          for d in *; do args+=("$REPO@sha256:$d"); done
          docker buildx imagetools create "${args[@]}"
          docker buildx imagetools inspect "${tags[0]}"
          printf '    publicado: %s\n' "${tags[@]}"
