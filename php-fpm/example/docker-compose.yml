services:
    app:
        build:
            context: .
            target: local
            args:
                - USER_ID=${USER_ID:-1000}
                - GROUP_ID=${GROUP_ID:-1000}
        image: laravel:1.0
        container_name: laravel
        working_dir: /var/www/html
        restart: unless-stopped
        tty: true
        depends_on:
            - mysql
            - redis
            - rustfs
        environment:
            XDEBUG_MODE: '${XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${XDEBUG_CONFIG:-client_host=host.docker.internal}'
        ports:
            - '${APP_PORT:-80}:8000'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        volumes:
            - .:/var/www/html
            - ./docker/php.ini:/etc/php/8.4/cli/conf.d/99-laravel.ini
            - ./docker/www.conf:/etc/php/8.4/fpm/pool.d/www.conf
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        networks:
            - laravel
    mysql:
        image: 'mysql/mysql-server:8.0'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD:-}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${MYSQL_DATABASE:-laravel}'
            MYSQL_USER: '${MYSQL_USER:-laravel}'
            MYSQL_PASSWORD: '${MYSQL_PASSWORD:-laravel}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'mysql-data:/var/lib/mysql'
            - './docker/db.sh:/docker-entrypoint-initdb.d/10-db.sh'
        networks:
            - laravel
        healthcheck:
            test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:7.2-alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'redis-data:/data'
        networks:
            - laravel
        healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            retries: 3
            timeout: 5s
    rustfs:
        image: 'rustfs/rustfs:latest'
        ports:
            - '${FORWARD_RUSTFS_PORT:-9000}:9000'
            - '${FORWARD_RUSTFS_CONSOLE_PORT:-9001}:9001'
        environment:
            RUSTFS_VOLUMES: '/data'
            RUSTFS_ADDRESS: '0.0.0.0:9000'
            RUSTFS_CONSOLE_ADDRESS: '0.0.0.0:9001'
            RUSTFS_CONSOLE_ENABLE: 'true'
            RUSTFS_EXTERNAL_ADDRESS: ':9000'
            RUSTFS_CORS_ALLOWED_ORIGINS: '*'
            RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: '*'
            RUSTFS_ACCESS_KEY: '${RUSTFS_ACCESS_KEY:-laravel}'
            RUSTFS_SECRET_KEY: '${RUSTFS_SECRET_KEY:-password}'
            RUSTFS_LOG_LEVEL: 'info'
        volumes:
            - 'rustfs-data:/data'
        networks:
            - laravel
        healthcheck:
            test: [ "CMD", "sh", "-c", "curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/health" ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
    mailpit:
        image: 'axllent/mailpit:v1.14'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - laravel

networks:
    laravel:
        driver: bridge

volumes:
    mysql-data:
        driver: local
    redis-data:
        driver: local
    rustfs-data:
        driver: local
