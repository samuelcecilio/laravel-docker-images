services:
    app:
        build:
            context: .
            target: local
            args:
                - USER_ID=${USER_ID:-1000}
                - GROUP_ID=${GROUP_ID:-1000}
        image: laravel:1.0
        container_name: laravel
        working_dir: /var/www/html
        restart: unless-stopped
        tty: true
        depends_on:
            - mysql
            - redis
            - minio
        environment:
            XDEBUG_MODE: '${XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${XDEBUG_CONFIG:-client_host=host.docker.internal}'
        ports:
            - '${APP_PORT:-80}:8000'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        volumes:
            - .:/var/www/html
            - ./docker/php.ini:/etc/php/8.4/cli/conf.d/99-laravel.ini
            - ./docker/www.conf:/etc/php/8.4/fpm/pool.d/www.conf
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        networks:
            - laravel
    mysql:
        image: 'mysql/mysql-server:8.0'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD:-}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${MYSQL_DATABASE:-laravel}'
            MYSQL_USER: '${MYSQL_USER:-laravel}'
            MYSQL_PASSWORD: '${MYSQL_PASSWORD:-laravel}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'mysql-data:/var/lib/mysql'
            - './docker/db.sh:/docker-entrypoint-initdb.d/10-db.sh'
        networks:
            - laravel
        healthcheck:
            test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:7.2-alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'redis-data:/data'
        networks:
            - laravel
        healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            retries: 3
            timeout: 5s
    minio:
        image: 'minio/minio:RELEASE.2023-12-23T07-19-11Z'
        ports:
            - '${FORWARD_MINIO_PORT:-9000}:9000'
            - '${FORWARD_MINIO_CONSOLE_PORT:-8900}:8900'
        environment:
            MINIO_ROOT_USER: '${MINIO_ROOT_USER:-laravel}'
            MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD:-laravel@1234}'
        volumes:
            - 'minio-data:/data/minio'
        networks:
            - laravel
        command: minio server /data/minio --console-address ":8900"
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:v1.14'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - laravel

networks:
    laravel:
        driver: bridge

volumes:
    mysql-data:
        driver: local
    redis-data:
        driver: local
    minio-data:
        driver: local
